  <g id="text_4">
   <text style="font-weight: 700; font-size: 24px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #253744" x="73.44" y="55.44" transform="rotate(-0 73.44 55.44)">T-N · TRUSS ELEVATION</text>
  </g>
  <g id="text_5">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #65747a" x="73.44" y="91.872" transform="rotate(-0 73.44 91.872)">West → east · dimensions along the framing line · member layout projected directly from the current 3D model</text>
  </g>
  <g id="text_6">
   <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a25b32" x="73.44" y="580.536" transform="rotate(-0 73.44 580.536)">COMMON BOTTOM = 8′ 2½″ ABOVE GROUND · COLUMN-SUPPORTED</text>
  </g>
  <g id="text_7">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #354952" transform="translate(73.44 623.774437)">UPRIGHT STATIONS X (in): -32, 53.25, 81.5, 113.5, 224.25, 249.5.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #354952" transform="translate(73.44 638.771469)">HEADER: nominal 24″ deep; eight equal bays of 35 3/16 in. Door: 32″ wide × 84″ high above loft floor.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #354952" transform="translate(73.44 653.7685)">DOOR center X = 97½″; opening edges X = 81½″ / 113½″. Floor is 8¾″ above common truss bottom.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #354952" transform="translate(73.44 668.765531)">North wall windows and side webs require coordination. Overall truss includes west walkway width; it is not loft-floor width.</text>
  </g>
  <g id="text_8">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #65747a" transform="translate(73.44 726.282812)">Concept geometry, not fabrication drawings. Member sizes, joints, bracing and bearing details require design.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #65747a" transform="translate(73.44 740.52)">The shallow hip roof cap sits above the rear ceiling datum; its internal framing has not been laid out.</text>
  </g>
