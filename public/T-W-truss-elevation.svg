  <g id="text_3">
   <text style="font-weight: 700; font-size: 24px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #253744" x="73.44" y="55.44" transform="rotate(-0 73.44 55.44)">T-W · TRUSS ELEVATION</text>
  </g>
  <g id="text_4">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #65747a" x="73.44" y="91.872" transform="rotate(-0 73.44 91.872)">South → north · station zero = south exterior garage wall · member layout projected directly from the current 3D model</text>
  </g>
  <g id="text_5">
   <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a25b32" x="73.44" y="580.536" transform="rotate(-0 73.44 580.536)">COMMON BOTTOM = 8′ 2½″ ABOVE GROUND · COLUMN-SUPPORTED</text>
  </g>
  <g id="text_6">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #354952" transform="translate(73.44 623.774437)">UPRIGHT STATIONS FROM SOUTH WALL (in): -63, -21.25, 0, 69.75, 146.15, 185, 186, 246, 253</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #354952" transform="translate(73.44 638.771469)">PANEL SPACINGS (in): 41.75, 21.25, 69.75, 76.4, 38.85, 1, 60, 7</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #354952" transform="translate(73.44 653.7685)">DEPTHS: south tip 8″; south wall 3′ 8⅜″; at T1 7′ 0⅝″; plateau 10′ 8¾″.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #354952" transform="translate(73.44 668.765531)">West door header is included. Closely spaced uprights at 185 / 186 in are retained from the model; opening framing needs coordination.</text>
  </g>
  <g id="text_7">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #65747a" transform="translate(73.44 726.282812)">Concept geometry, not fabrication drawings. Member sizes, joints, bracing and bearing details require design.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #65747a" transform="translate(73.44 740.52)">The shallow hip roof cap sits above the rear ceiling datum; its internal framing has not been laid out.</text>
  </g>
