#toolbar button span{font:13px Arial,sans-serif!important;color:inherit!important;padding:0!important}#toolbar button[aria-pressed="true"]{background:#252b2d!important;color:white;border-color:#252b2d!important}#toolbar button:hover,select:hover,#fit-view:hover{border-color:#898c84!important}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #367d7f;outline-offset:3px}.toggle{display:flex;align-items:center;gap:5px;white-space:nowrap;font-size:12px;cursor:pointer}input{accent-color:#343631}

</style><style>model-viewer{display:block;width:100%;height:100%;background:#f5f3ec}#toolbar-display a{padding:9px 12px;border:1px solid #deddd5;border-radius:6px;text-decoration:none;font-size:13px}a{color:#345967}#model-canvas{height:100%}h1{margin:0 0 5px}</style></head><body><main class="generated-screen"><header id="header" class="fx-col">

</div>

<div id="model-canvas"><model-viewer id="backyard" src="backyard-current.glb" alt="Current garage framing and roof in the existing backyard" camera-controls disable-tap touch-action="none" interaction-prompt="none" camera-target="2.1m 2.8m -2m" camera-orbit="-40deg 68deg 24m" min-camera-orbit="auto 8deg 2m" max-camera-orbit="auto 88deg 100m" field-of-view="40deg" exposure="1" shadow-intensity="0.5" shadow-softness="0.8" environment-image="neutral"></model-viewer></div>

<script type="module" src="model-viewer.min.js"></script><script>
const viewer=document.getElementById('backyard');let active='garage';
const cameras={garage:{target:'2.1m 2.8m -2m',orbit:'-40deg 68deg 24m',title:'Garage view'},patio:{target:'1.8m 3m -2m',orbit:'-30deg 82deg 20m',title:'From the patio'},yard:{target:'auto auto auto',orbit:'-35deg 48deg 105%',title:'Whole backyard'},top:{target:'auto auto auto',orbit:'0deg 8deg 105%',title:'Above the backyard'}};
function setCamera(key){active=key;const c=cameras[key];viewer.cameraTarget=c.target;viewer.cameraOrbit=c.orbit;document.getElementById('view-title').textContent=c.title;document.querySelectorAll('[data-camera]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.camera===key)));}
document.querySelectorAll('[data-camera]').forEach(b=>b.onclick=()=>setCamera(b.dataset.camera));document.getElementById('fit-view').onclick=()=>setCamera(active);
viewer.addEventListener('load',()=>{setCamera('garage');document.getElementById('member-detail').textContent='Interactive Blender scene · Simplified foliage and real-time lighting';});
viewer.addEventListener('error',()=>{document.getElementById('member-detail').textContent='The 3D model could not load. Try reloading the page.';});
</script></body></html>
